; Rizky Moto AI - Laravel queue workers
; Ubuntu/AWS deployment
; Keep QUEUE_WORKER_COUNT=3 in the application's .env.
; The dashboard controls all three processes through supervisorctl.

[program:rizky-moto-ai-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/rizky-moto-ai/artisan queue:work database --sleep=2 --tries=3 --timeout=300 --max-jobs=100 --max-time=3600
directory=/var/www/rizky-moto-ai
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
numprocs_start=0
redirect_stderr=true
stdout_logfile=/var/www/rizky-moto-ai/storage/logs/queue-worker-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=360

; The application calls supervisorctl through sudo -n.
; Add the web/PHP user to a narrowly scoped sudoers rule for:
; /usr/bin/supervisorctl start rizky-moto-ai-worker:*
; /usr/bin/supervisorctl stop rizky-moto-ai-worker:*
; /usr/bin/supervisorctl status rizky-moto-ai-worker:*
