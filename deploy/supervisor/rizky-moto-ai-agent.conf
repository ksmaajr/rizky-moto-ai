; Example Supervisor program for the dedicated AgentKit queue on Ubuntu.
; Adjust /var/www/rizky-moto-ai to the actual Laravel release path and
; ensure the app user owns storage/ and bootstrap/cache/.
[program:rizky-moto-ai-agent]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/rizky-moto-ai/artisan queue:work database --queue=agentkit --sleep=2 --tries=1 --timeout=300 --max-jobs=100 --max-time=3600
directory=/var/www/rizky-moto-ai
user=www-data
numprocs=3
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=330
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/var/www/rizky-moto-ai/storage/logs/agentkit-supervisor-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/www/rizky-moto-ai/storage/logs/agentkit-supervisor-error-%(process_num)02d.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
