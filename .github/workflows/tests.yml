name: tests

on:
  push:
    branches:
      - main
      - feature/ai-provider-architecture
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare test environment
        run: |
          printf '%s\n' \
            'APP_NAME="Rizky Tools AI"' \
            'APP_ENV=testing' \
            'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            'APP_DEBUG=true' \
            'APP_URL=http://localhost' \
            'DB_CONNECTION=sqlite' \
            'DB_DATABASE=:memory:' \
            'CACHE_STORE=array' \
            'SESSION_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=array' > .env
          composer install --no-interaction --prefer-dist

      - name: Check AgentKit credential importer formatting
        run: vendor/bin/pint --test app/Console/Commands/ImportCodexCredentialCommand.php tests/Feature/ImportCodexCredentialCommandTest.php

      - name: Test AgentKit credential importer
        run: php artisan test --filter=ImportCodexCredentialCommandTest
